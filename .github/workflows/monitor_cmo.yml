name: Monitor CMO D+1 (ONS)

on:
  schedule:
    - cron: "25 16 * * *"   # 13:25 BRT — começa a consultar a cada 5 min
    - cron: "40 17 * * *"   # 14:40 BRT — reserva, caso o agendamento anterior falhe (sai se já registrado)
  workflow_dispatch:
  push:
    paths:
      - "clima/monitor_cmo.py"
      - ".github/workflows/monitor_cmo.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-cmo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas requests matplotlib
      - name: Consulta a cada 5 minutos até o CMO de D+1 sair (limite 19:15 BRT)
        run: |
          git config user.name "squadra-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          python -m clima.monitor_cmo --intervalo 300 --ate 19:15
